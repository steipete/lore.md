name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: Existing release version to validate or publish
        required: true
        type: string
      dry_run:
        description: Validate and verify without tags or publication
        default: true
        type: boolean

permissions: {}

concurrency:
  group: release-${{ github.repository }}-${{ inputs.version || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    permissions:
      actions: read
      checks: read
      contents: write
      statuses: read
    uses: openclaw/release-workflows/.github/workflows/release-source.yml@v1
    with:
      version: ${{ inputs.version || github.ref_name }}
      dry_run: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
      require-signed-tag: true
      strict-checks: true
      ci-check-events: '["push"]'
      source-archives: true
      test-command: >-
        npx --yes --package=node@22.13.0 --package=pnpm@11.28.4 --call
        'pnpm install --frozen-lockfile && pnpm check && pnpm exec wrangler deploy --dry-run'
